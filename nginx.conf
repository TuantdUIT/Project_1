server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: mọi route không khớp file tĩnh đều trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache asset tĩnh có hash trong tên file
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
